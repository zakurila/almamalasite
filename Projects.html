<script>
const projectsContainer = document.getElementById("projects");

projects.forEach(project => {
  projectsContainer.insertAdjacentHTML("beforeend", `
    <div class="project">

      <img src="${project.image}" alt="${project.title}">

      <h3>${project.title}</h3>

      <p class="project-date">${project.date}</p>

      <p>${project.shortText}</p>

      <button
        data-modal-target="#modal-${project.id}"
        class="open-btn readmore">
        Read more
      </button>

      <div
        id="modal-${project.id}"
        class="modal"
        aria-hidden="true"
        role="dialog"
        aria-modal="true">

        <div class="modal__backdrop" data-close></div>

        <div class="modal__panel">
          <button data-close class="modal__close">×</button>

          <img src="${project.image}" alt="${project.title}">

          <h4>${project.modalTitle}</h4>

          <p><strong>${project.date}</strong></p>

          <p>${project.modalContent}</p>
        </div>
      </div>

    </div>
  `);
});
</script>


<script> 
document.querySelectorAll('[data-modal-target]').forEach(btn => {
  btn.addEventListener('click', () => {
    const modal = document.querySelector(btn.dataset.modalTarget);
    if (modal) openModal(modal);
  });
});

document.addEventListener('click', e => {
  const closeEl = e.target.closest('[data-close]');
  if (closeEl) {
    const modal = closeEl.closest('.modal');
    if (modal) closeModal(modal);
  }
});

document.addEventListener('keydown', e => {
  if (e.key === 'Escape') {
    document.querySelectorAll('.modal[aria-hidden="false"]').forEach(closeModal);
  }
});

function openModal(modal) {
  modal.setAttribute('aria-hidden', 'false');
  modal.querySelector('.modal__panel')?.focus();
  document.body.style.overflow = 'hidden';
}

function closeModal(modal) {
  modal.setAttribute('aria-hidden', 'true');
  document.body.style.overflow = '';
}





</script> 

<script>
(function(){
	if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
	const el = document.getElementById('content') || document.querySelector('.content');
	if (!el) return;

	function scrollToElement(el, duration = 2000) {
		const start = window.scrollY || window.pageYOffset;
		const target = el.getBoundingClientRect().top + start;
		const distance = target - start;
		const startTime = performance.now();
		const ease = t => t < 0.5 ? 2*t*t : -1 + (4-2*t)*t; // easeInOut

		function step(now) {
			const t = Math.min(1, (now - startTime) / duration);
			window.scrollTo(0, start + distance * ease(t));
			if (t < 1) requestAnimationFrame(step);
		}
		requestAnimationFrame(step);
	}

	window.addEventListener('load', () => {
		setTimeout(() => {                // slight delay for images/layout
			scrollToElement(el, 2000);      // change 2000 → larger ms to slow more
		}, 150);
	});
})();
</script>
